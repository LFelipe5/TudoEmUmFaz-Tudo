{% extends 'core/base.html' %}{% block content %}<p class="eyebrow">ORGANIZE</p><h1>One thing at a time.</h1><form class="panel" method="post">{% csrf_token %}{{ form.as_p }}<button class="button">Add task</button></form><section>{% for task in tasks %}<article class="task"><span {% if task.completed %}class="done"{% endif %}>{{ task.title }}</span><div><form method="post" action="{% url 'task-action' task.pk 'toggle' %}">{% csrf_token %}<button>{% if task.completed %}Reopen{% else %}Complete{% endif %}</button></form><form method="post" action="{% url 'task-action' task.pk 'delete' %}">{% csrf_token %}<button>Delete</button></form></div></article>{% empty %}<p>No tasks yet. Add your first one above.</p>{% endfor %}</section>{% endblock %}
