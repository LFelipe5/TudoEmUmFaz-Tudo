services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - toolbox_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 15s
      retries: 3
volumes:
  toolbox_data:
